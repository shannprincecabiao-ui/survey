<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Social Media & Sleep Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            darkbg: "#0a0a0a",
            neonpurple: "#a855f7",
            neoncyan: "#06b6d4"
          }
        }
      }
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #050505;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(168,85,247,.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6,182,212,.15) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(18,18,22,.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 20px 50px rgba(0,0,0,.5), 0 0 30px rgba(168,85,247,.1);
    }
    .neon-glow:focus {
      box-shadow: 0 0 15px rgba(6,182,212,.25);
      border-color: #06b6d4;
    }
    select option { background: #18181b; color: #f3f4f6; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen text-gray-100 flex items-center justify-center p-4 sm:p-6">
  <main class="w-full max-w-xl mx-auto">
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-cyan-500 p-0.5 mb-4 shadow-lg shadow-purple-500/20">
        <div class="w-full h-full bg-darkbg rounded-[14px] flex items-center justify-center">
          <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v3m0 12v3M3 12h3m12 0h3M5.64 5.64l2.12 2.12m8.48 8.48 2.12 2.12m0-12.72-2.12 2.12m-8.48 8.48-2.12 2.12M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
        </div>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">
        Student Survey
      </h1>
      <p class="text-sm sm:text-base text-gray-400 mt-3 leading-relaxed">
        The Relationship Between Daily Social Media Consumption and Sleep Duration Among College Students
      </p>
    </header>

    <section class="glass-panel rounded-3xl p-6 sm:p-10 relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <form id="surveyForm" class="space-y-6 relative z-10">
        <div class="space-y-2">
          <label for="academicLevel" class="block text-sm font-medium text-gray-300">
            Academic Level <span class="text-cyan-400">*</span>
          </label>
          <select id="academicLevel" name="academicLevel" required
            class="neon-glow w-full px-4 py-3.5 bg-black/40 border border-gray-800 rounded-xl text-gray-100 focus:outline-none transition-all text-sm sm:text-base">
            <option value="" disabled selected>Select your academic level</option>
            <option value="1st Year College">1st Year College</option>
            <option value="2nd Year College">2nd Year College</option>
            <option value="3rd Year College">3rd Year College</option>
            <option value="4th Year College">4th Year College</option>
            <option value="5th Year College or Higher">5th Year College or Higher</option>
          </select>
        </div>

        <div class="space-y-2">
          <label for="gender" class="block text-sm font-medium text-gray-300">
            Gender <span class="text-cyan-400">*</span>
          </label>
          <select id="gender" name="gender" required
            class="neon-glow w-full px-4 py-3.5 bg-black/40 border border-gray-800 rounded-xl text-gray-100 focus:outline-none transition-all text-sm sm:text-base">
            <option value="" disabled selected>Select your gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
        </div>

        <div class="space-y-2">
          <label for="socialMediaHours" class="block text-sm font-medium text-gray-300 leading-relaxed">
            How many hours per day do you spend on social media platforms (e.g., Instagram, TikTok, YouTube, X/Twitter, etc.)?
            <span class="text-cyan-400">*</span>
          </label>
          <select id="socialMediaHours" name="socialMediaHours" required
            class="neon-glow w-full px-4 py-3.5 bg-black/40 border border-gray-800 rounded-xl text-gray-100 focus:outline-none transition-all text-sm sm:text-base">
            <option value="" disabled selected>Select hours per day</option>
          </select>
        </div>

        <div class="space-y-2">
          <label for="sleepHours" class="block text-sm font-medium text-gray-300 leading-relaxed">
            On days when you use social media, how many hours of sleep do you get per night?
            <span class="text-cyan-400">*</span>
          </label>
          <select id="sleepHours" name="sleepHours" required
            class="neon-glow w-full px-4 py-3.5 bg-black/40 border border-gray-800 rounded-xl text-gray-100 focus:outline-none transition-all text-sm sm:text-base">
            <option value="" disabled selected>Select hours of sleep</option>
          </select>
        </div>

        <div class="pt-2">
 
<button type="button" onclick="window.location.href='submit.html'"
  class="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-cyan-500 text-white font-semibold shadow-lg shadow-purple-500/25 hover:shadow-cyan-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2">
  <span>Submit</span>
  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0-7 7m7-7H3"/>
  </svg>
</button>

        </div>
        <p id="statusMessage" class="hidden text-sm text-center rounded-xl border border-amber-500/30 bg-amber-500/10 text-amber-200 p-3" role="status"></p>
      </form>
    </section>

    <p class="text-center text-xs text-gray-600 mt-6">
      Please answer each question honestly. Do not include your name or other identifying information.
    </p>
  </main>


<script>
  // Your Google Apps Script API URL
  const API_URL = "https://script.google.com/macros/s/AKfycbx7U93hhh8UxMZ0ujioz3qIqQmz-yDFgo64LoHrfZGshEJESoyEdamzh9kkLuwpiwQKUQ/exec";

  // Add hour choices from 1 to 24 to both dropdowns
  const hourDropdowns = [
    document.getElementById("socialMediaHours"),
    document.getElementById("sleepHours")
  ];

  hourDropdowns.forEach((dropdown) => {
    for (let hour = 1; hour <= 24; hour++) {
      const option = document.createElement("option");
      option.value = String(hour);
      option.textContent =
        `${hour} ${hour === 1 ? "hour" : "hours"}`;
      dropdown.appendChild(option);
    }
  });

  const form = document.getElementById("surveyForm");
  const statusMessage = document.getElementById("statusMessage");
  const submitButton = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!form.reportValidity()) return;

    const response = {
      academicLevel:
        document.getElementById("academicLevel").value,
      gender:
        document.getElementById("gender").value,
      socialMediaHours:
        Number(document.getElementById("socialMediaHours").value),
      sleepHours:
        Number(document.getElementById("sleepHours").value)
    };

    submitButton.disabled = true;
    submitButton.querySelector("span").textContent = "Submitting...";
    statusMessage.classList.add("hidden");

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(response)
      });

      // The browser cannot verify the API response in no-cors mode.
      // Redirect after sending the request.
      window.location.href = "submit.html";

    } catch (error) {
      statusMessage.textContent =
        "Unable to submit your response. Please check your internet connection and try again.";

      statusMessage.classList.remove("hidden");
      submitButton.disabled = false;
      submitButton.querySelector("span").textContent = "Submit";

      console.error("Survey submission error:", error);
    }
  });
</script>
</body>
</html>
